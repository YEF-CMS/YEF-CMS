name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Expected and actual behavior, error text if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: YEF CMS version or commit
  - type: input
    id: php
    attributes:
      label: PHP version and web server
      description: For example PHP 8.4.1, Apache with mod_rewrite, shared hosting.
